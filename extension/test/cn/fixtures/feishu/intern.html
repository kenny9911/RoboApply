<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>样例出行实习招聘</title></head>
<body>
<div id="root">
  <h2 class="position-title">产品运营实习生</h2><div class="company-name">样例出行</div>
  <form class="ud__form">
    <div class="block-title">基本信息</div>
    <div class="ud__form__item"><div class="ud__form__item__label"><span class="required">*</span>姓名</div><div class="ud__form__item__control"><input id="fi_name" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label"><span class="required">*</span>手机号</div><div class="ud__form__item__control"><input id="fi_phone" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label"><span class="required">*</span>邮箱</div><div class="ud__form__item__control"><input id="fi_email" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label">微信号</div><div class="ud__form__item__control"><input id="fi_wechat" class="ud__input"></div></div>
    <div class="block-title">实习经历</div>
    <div class="ud__form__item"><div class="ud__form__item__label">公司名称</div><div class="ud__form__item__control"><input id="fi_company" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label">职位名称</div><div class="ud__form__item__control"><input id="fi_title" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label">开始时间</div><div class="ud__form__item__control"><input id="fi_from" type="month" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label">结束时间</div><div class="ud__form__item__control"><input id="fi_to" type="month" class="ud__input"></div></div>
    <div class="block-title">实习信息</div>
    <div class="ud__form__item"><div class="ud__form__item__label"><span class="required">*</span>每周实习天数</div><div class="ud__form__item__control"><select id="fi_days"><option value="">请选择</option><option>3天</option><option>4天</option><option>5天及以上</option></select></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label">实习时长</div><div class="ud__form__item__control"><select id="fi_len"><option value="">请选择</option><option>1-2个月</option><option>3个月</option><option>6个月</option></select></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label">最快到岗时间</div><div class="ud__form__item__control"><input id="fi_avail" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label">简历</div><div class="ud__form__item__control"><input id="fi_resume" type="file"></div></div>
    <div class="apply-footer"><button type="submit" class="ud__button ud__button--filled">提交</button></div>
  </form>
</div>
</body>
</html>
