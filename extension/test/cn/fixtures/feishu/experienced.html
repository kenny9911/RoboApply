<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>演示云 社会招聘</title></head>
<body>
<div id="root">
  <h2 class="job-title">高级前端工程师</h2><div class="company-name">演示云</div><span class="job-city">深圳</span>
  <form class="ud__form apply-form">
    <div class="module-title">基本信息</div>
    <div class="ud__form__item"><div class="ud__form__item__label"><span class="required">*</span>姓名</div><div class="ud__form__item__control"><input id="fe_name" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label"><span class="required">*</span>手机号码</div><div class="ud__form__item__control"><input id="fe_phone" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label"><span class="required">*</span>邮箱</div><div class="ud__form__item__control"><input id="fe_email" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label">民族</div><div class="ud__form__item__control"><input id="fe_ethnic" class="ud__input"></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label">婚姻状况</div><div class="ud__form__item__control"><select id="fe_marital"><option value="">请选择</option><option>未婚</option><option>已婚</option></select></div></div>
    <div class="ud__form__item"><div class="ud__form__item__label"><span class="required">*</span>身份证号</div><div class="ud__form__item__control"><input id="fe_id" class="ud__input"></div></div>
    <div class="module-title">工作经历</div>
    <div class="exp">
      <div class="ud__form__item"><div class="ud__form__item__label">公司</div><div class="ud__form__item__control"><input id="fe0_company" class="ud__input"></div></div>
      <div class="ud__form__item"><div class="ud__form__item__label">职位</div><div class="ud__form__item__control"><input id="fe0_title" class="ud__input"></div></div>
      <div class="ud__form__item"><div class="ud__form__item__label">入职时间</div><div class="ud__form__item__control"><input id="fe0_from" class="ud__input"></div></div>
      <div class="ud__form__item"><div class="ud__form__item__label">离职时间</div><div class="ud__form__item__control"><input id="fe0_to" class="ud__input"></div></div>
    </div>
    <div class="exp">
      <div class="ud__form__item"><div class="ud__form__item__label">公司</div><div class="ud__form__item__control"><input id="fe1_company" class="ud__input"></div></div>
      <div class="ud__form__item"><div class="ud__form__item__label">职位</div><div class="ud__form__item__control"><input id="fe1_title" class="ud__input"></div></div>
      <div class="ud__form__item"><div class="ud__form__item__label">入职时间</div><div class="ud__form__item__control"><input id="fe1_from" class="ud__input"></div></div>
      <div class="ud__form__item"><div class="ud__form__item__label">离职时间</div><div class="ud__form__item__control"><input id="fe1_to" class="ud__input"></div></div>
    </div>
    <div class="ud__form__item"><div class="ud__form__item__label"><span class="required">*</span>附件简历</div><div class="ud__form__item__control"><input id="fe_resume" type="file"></div></div>
    <div class="apply-footer"><button type="button" class="ud__button ud__button--filled">提交申请</button></div>
  </form>
</div>
</body>
</html>
