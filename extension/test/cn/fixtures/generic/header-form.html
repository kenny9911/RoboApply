<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>示例游戏校园招聘</title></head>
<body>
<header><form action="/search"><input type="search" name="q" placeholder="搜索职位"><button type="submit">搜索</button></form></header>
<main>
  <h1 class="job-title">游戏策划</h1>
  <form id="apply">
    <h3>基本信息</h3>
    <p><label for="g_name">姓名</label><input id="g_name"></p>
    <p><label for="g_phone">手机号码</label><input id="g_phone"></p>
    <p><label for="g_mail">邮箱</label><input id="g_mail" type="email"></p>
    <h3>教育经历</h3>
    <p><label for="g_school">学校</label><input id="g_school"></p>
    <p><label for="g_degree">学历</label><input id="g_degree"></p>
    <p><button type="submit">提交</button></p>
  </form>
</main>
</body>
</html>
