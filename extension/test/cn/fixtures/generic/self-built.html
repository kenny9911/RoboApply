<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>示例游戏招聘官网</title></head>
<body>
<header><nav><input type="search" placeholder="搜索职位"></nav></header>
<main>
  <h1 class="job-title">游戏客户端开发</h1>
  <div class="company-name">示例游戏</div>
  <form id="apply">
    <h3>基本信息</h3>
    <p><label for="g_name">姓名 *</label><input id="g_name" required></p>
    <p><label for="g_phone">手机号码 *</label><input id="g_phone" type="tel" required></p>
    <p><label for="g_mail">邮箱 *</label><input id="g_mail" type="email" required></p>
    <h3>教育经历</h3>
    <p><label for="g_school">学校</label><input id="g_school"></p>
    <p><label for="g_degree">学历</label><select id="g_degree"><option value="">请选择</option><option>本科</option><option>硕士</option><option>博士</option></select></p>
    <p><label for="g_major">专业</label><input id="g_major"></p>
    <h3>附件</h3>
    <p><label for="g_cv">简历</label><input id="g_cv" type="file"></p>
    <p><button type="submit">提交</button></p>
  </form>
</main>
</body>
</html>
