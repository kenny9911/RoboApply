<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>样例汽车 校园招聘</title></head>
<body>
<div class="page">
  <div class="post-name">电池研发工程师</div>
  <div class="apply">
    <div class="block-title">个人资料</div>
    <div class="row"><span class="item-label">姓名</span><input class="ipt" name="xm" aria-label="姓名"></div>
    <div class="row"><span class="item-label">手机</span><input class="ipt" name="sj" aria-label="手机"></div>
    <div class="row"><span class="item-label">邮箱</span><input class="ipt" name="yx" aria-label="邮箱"></div>
    <div class="row"><span class="item-label">政治面貌</span><input class="ipt" name="zzmm" aria-label="政治面貌"></div>
    <div class="block-title">教育经历</div>
    <div class="row"><span class="item-label">学校</span><input class="ipt" name="xx" aria-label="学校"></div>
    <div class="row"><span class="item-label">专业</span><input class="ipt" name="zy" aria-label="专业"></div>
    <div class="row"><span class="item-label">简历</span><input type="file" name="cv" aria-label="简历"></div>
    <div class="actions"><a role="button" class="btn">确认投递</a></div>
  </div>
</div>
</body>
</html>
