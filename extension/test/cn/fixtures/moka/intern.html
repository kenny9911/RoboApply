<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>样例互联网 - 实习生招聘</title></head>
<body>
<div id="root">
  <div class="job-detail-header"><h1 class="job-title">数据分析实习生</h1><div class="org-name">样例互联网</div><span class="job-location">北京</span></div>
  <form class="ant-form apply-form">
    <div class="form-group-block">
      <div class="section-title">基本信息</div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="f_name" class="ant-form-item-required">姓名：</label></div><div class="ant-form-item-control"><input id="f_name" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="f_phone" class="ant-form-item-required">手机号码：</label></div><div class="ant-form-item-control"><input id="f_phone" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="f_email" class="ant-form-item-required">邮箱：</label></div><div class="ant-form-item-control"><input id="f_email" class="ant-input" value="old@example.test"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="f_wechat">微信号：</label></div><div class="ant-form-item-control"><input id="f_wechat" class="ant-input"></div></div>
    </div>
    <div class="form-group-block">
      <div class="section-title">实习经历</div>
      <div class="exp-item">
        <div class="ant-form-item"><div class="ant-form-item-label"><label for="exp0_company">公司名称</label></div><div class="ant-form-item-control"><input id="exp0_company" class="ant-input"></div></div>
        <div class="ant-form-item"><div class="ant-form-item-label"><label for="exp0_title">职位名称</label></div><div class="ant-form-item-control"><input id="exp0_title" class="ant-input"></div></div>
        <div class="ant-form-item"><div class="ant-form-item-label"><label for="exp0_start">开始时间</label></div><div class="ant-form-item-control"><input id="exp0_start" class="ant-input" placeholder="2025/06"></div></div>
        <div class="ant-form-item"><div class="ant-form-item-label"><label for="exp0_end">结束时间</label></div><div class="ant-form-item-control"><input id="exp0_end" class="ant-input" placeholder="2025/09"></div></div>
        <div class="ant-form-item"><div class="ant-form-item-label"><label for="exp0_desc">工作描述</label></div><div class="ant-form-item-control"><textarea id="exp0_desc" class="ant-input"></textarea></div></div>
      </div>
    </div>
    <div class="form-group-block">
      <div class="section-title">实习意向</div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="f_days" class="ant-form-item-required">每周可实习天数</label></div><div class="ant-form-item-control"><select id="f_days"><option value="">请选择</option><option value="3">3天</option><option value="4">4天</option><option value="5">5天</option></select></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="f_months">实习时长</label></div><div class="ant-form-item-control"><select id="f_months"><option value="">请选择</option><option value="1">1-2个月</option><option value="3">3个月</option><option value="6">6个月</option></select></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="f_start">最快到岗时间</label></div><div class="ant-form-item-control"><input id="f_start" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="f_intro">自我评价</label></div><div class="ant-form-item-control"><textarea id="f_intro" class="ant-input" maxlength="500"></textarea></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="f_resume" class="ant-form-item-required">附件简历</label></div><div class="ant-form-item-control"><input id="f_resume" type="file"></div></div>
    </div>
    <div class="footer"><button type="submit" class="ant-btn ant-btn-primary">提交</button></div>
  </form>
</div>
</body>
</html>
