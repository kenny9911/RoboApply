<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>样例科技校园招聘</title></head>
<body>
<div id="root">
  <div class="nav-bar"><form class="ant-form ant-form-inline"><div class="ant-form-item"><div class="ant-form-item-control"><input id="kw" class="ant-input" placeholder="搜索职位"></div></div></form></div>
  <h1 class="job-title">测试开发工程师</h1><div class="org-name">样例科技</div>
  <form class="ant-form apply-form">
    <div class="section">
      <div class="section-title">基本信息</div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="m_name" class="ant-form-item-required">姓名</label></div><div class="ant-form-item-control"><input id="m_name" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="m_phone" class="ant-form-item-required">手机</label></div><div class="ant-form-item-control"><input id="m_phone" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="m_email" class="ant-form-item-required">邮箱</label></div><div class="ant-form-item-control"><input id="m_email" class="ant-input"></div></div>
    </div>
    <div class="section">
      <div class="section-title">求学经历</div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="q0_school">学校名称</label></div><div class="ant-form-item-control"><input id="q0_school" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="q0_major">专业</label></div><div class="ant-form-item-control"><input id="q0_major" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="q1_school">学校名称</label></div><div class="ant-form-item-control"><input id="q1_school" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="q1_major">专业</label></div><div class="ant-form-item-control"><input id="q1_major" class="ant-input"></div></div>
    </div>
    <div class="section">
      <div class="section-title">补充信息</div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="o_name">姓名</label></div><div class="ant-form-item-control"><input id="o_name" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="o_phone">手机</label></div><div class="ant-form-item-control"><input id="o_phone" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="o_cet">英语四六级成绩</label></div><div class="ant-form-item-control"><input id="o_cet" class="ant-input"></div></div>
    </div>
    <div class="section">
      <div class="section-title">实习经历</div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="x_company">公司名称</label></div><div class="ant-form-item-control"><input id="x_company" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="x_ref">证明人</label></div><div class="ant-form-item-control"><input id="x_ref" class="ant-input"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label for="x_ref_phone">证明人电话</label></div><div class="ant-form-item-control"><input id="x_ref_phone" class="ant-input"></div></div>
    </div>
    <div class="apply-submit"><button type="submit" class="ant-btn ant-btn-primary">提交申请</button></div>
  </form>
</div>
</body>
</html>
