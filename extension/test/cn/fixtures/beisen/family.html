<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>样本银行招聘</title></head>
<body>
<div id="app">
  <h1 class="position-name">柜面服务岗</h1><div class="company-name">样本银行</div>
  <form class="el-form resume-form">
    <div class="module">
      <div class="module-title">个人信息</div>
      <div class="el-form-item is-required"><label for="b_name" class="el-form-item__label">姓名</label><div class="el-form-item__content"><input id="b_name" class="el-input__inner"></div></div>
      <div class="el-form-item is-required"><label for="b_phone" class="el-form-item__label">手机号码</label><div class="el-form-item__content"><input id="b_phone" class="el-input__inner"></div></div>
      <div class="el-form-item is-required"><label for="b_email" class="el-form-item__label">邮箱</label><div class="el-form-item__content"><input id="b_email" class="el-input__inner"></div></div>
      <div class="el-form-item"><label for="b_native" class="el-form-item__label">籍贯</label><div class="el-form-item__content"><input id="b_native" class="el-input__inner"></div></div>
      <div class="el-form-item"><label for="b_hukou" class="el-form-item__label">户口所在地</label><div class="el-form-item__content"><input id="b_hukou" class="el-input__inner"></div></div>
    </div>
    <div class="module">
      <div class="module-title">家庭成员</div>
      <div class="el-card member">
        <div class="el-form-item"><label for="m0_rel" class="el-form-item__label">称谓</label><div class="el-form-item__content"><input id="m0_rel" class="el-input__inner"></div></div>
        <div class="el-form-item"><label for="m0_name" class="el-form-item__label">姓名</label><div class="el-form-item__content"><input id="m0_name" class="el-input__inner"></div></div>
        <div class="el-form-item"><label for="m0_org" class="el-form-item__label">工作单位</label><div class="el-form-item__content"><input id="m0_org" class="el-input__inner"></div></div>
        <div class="el-form-item"><label for="m0_title" class="el-form-item__label">职务</label><div class="el-form-item__content"><input id="m0_title" class="el-input__inner"></div></div>
        <div class="el-form-item"><label for="m0_phone" class="el-form-item__label">联系电话</label><div class="el-form-item__content"><input id="m0_phone" class="el-input__inner"></div></div>
      </div>
      <div class="el-card member">
        <div class="el-form-item"><label for="m1_rel" class="el-form-item__label">称谓</label><div class="el-form-item__content"><input id="m1_rel" class="el-input__inner"></div></div>
        <div class="el-form-item"><label for="m1_name" class="el-form-item__label">姓名</label><div class="el-form-item__content"><input id="m1_name" class="el-input__inner"></div></div>
        <div class="el-form-item"><label for="m1_org" class="el-form-item__label">工作单位</label><div class="el-form-item__content"><input id="m1_org" class="el-input__inner"></div></div>
        <div class="el-form-item"><label for="m1_title" class="el-form-item__label">职务</label><div class="el-form-item__content"><input id="m1_title" class="el-input__inner"></div></div>
        <div class="el-form-item"><label for="m1_phone" class="el-form-item__label">联系电话</label><div class="el-form-item__content"><input id="m1_phone" class="el-input__inner"></div></div>
      </div>
    </div>
    <div class="module">
      <div class="module-title">附件</div>
      <div class="el-form-item is-required"><label for="b_resume" class="el-form-item__label">附件简历</label><div class="el-form-item__content"><input id="b_resume" type="file"></div></div>
    </div>
    <div class="form-actions"><button type="button" class="el-button">保存</button><button type="button" class="el-button el-button--primary">提交</button></div>
  </form>
</div>
</body>
</html>
