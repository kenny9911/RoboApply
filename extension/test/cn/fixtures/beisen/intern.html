<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>模拟证券实习生招聘</title></head>
<body>
<div id="app">
  <h1 class="job-name">投行部实习生</h1><div class="company-name">模拟证券</div>
  <form class="el-form apply-form">
    <div class="module-title">个人信息</div>
    <div class="el-form-item is-required"><label for="i_name" class="el-form-item__label">真实姓名</label><div class="el-form-item__content"><input id="i_name" class="el-input__inner"></div></div>
    <div class="el-form-item is-required"><label for="i_phone" class="el-form-item__label">联系电话</label><div class="el-form-item__content"><input id="i_phone" class="el-input__inner"></div></div>
    <div class="el-form-item is-required"><label for="i_email" class="el-form-item__label">邮箱地址</label><div class="el-form-item__content"><input id="i_email" class="el-input__inner"></div></div>
    <div class="module-title">实习经历</div>
    <div class="el-form-item"><label for="i_company" class="el-form-item__label">实习单位</label><div class="el-form-item__content"><input id="i_company" class="el-input__inner"></div></div>
    <div class="el-form-item"><label for="i_post" class="el-form-item__label">岗位</label><div class="el-form-item__content"><input id="i_post" class="el-input__inner"></div></div>
    <div class="el-form-item"><label for="i_from" class="el-form-item__label">开始时间</label><div class="el-form-item__content"><input id="i_from" class="el-input__inner" placeholder="2025年06月"></div></div>
    <div class="el-form-item"><label for="i_to" class="el-form-item__label">结束时间</label><div class="el-form-item__content"><input id="i_to" class="el-input__inner" placeholder="2025年09月"></div></div>
    <div class="module-title">其他信息</div>
    <div class="el-form-item is-required"><label class="el-form-item__label">每周可实习天数</label><div class="el-form-item__content">
      <label class="el-radio"><input type="radio" name="i_days" value="3"><span>3天</span></label>
      <label class="el-radio"><input type="radio" name="i_days" value="4"><span>4天</span></label>
      <label class="el-radio"><input type="radio" name="i_days" value="5"><span>5天</span></label>
    </div></div>
    <div class="el-form-item"><label for="i_avail" class="el-form-item__label">到岗时间</label><div class="el-form-item__content"><input id="i_avail" class="el-input__inner"></div></div>
    <div class="el-form-item"><label for="i_why" class="el-form-item__label">为什么想加入我们</label><div class="el-form-item__content"><textarea id="i_why" class="el-textarea__inner"></textarea></div></div>
    <div class="el-form-item is-required"><label for="i_cv" class="el-form-item__label">上传简历</label><div class="el-form-item__content"><input id="i_cv" type="file"></div></div>
    <div class="form-actions"><button type="button" class="el-button">保存</button><button type="button" class="el-button el-button--primary">确认提交</button></div>
  </form>
</div>
</body>
</html>
