<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application</title>
  <meta property="og:site_name" content="Demo Studio Careers">
</head>
<body>
  <div class="flowTrail"><span class="current">Job-Specific Questions</span></div>
  <form name="ftlform" method="post">
    <span id="requisitionDescriptionInterface.reqTitleLinkAction.row1">Store Associate</span>
    <fieldset>
      <legend>Are you 18 years of age or older? *</legend>
      <input type="radio" id="q1-1" name="q1" value="1"><label for="q1-1">Yes</label>
      <input type="radio" id="q1-2" name="q1" value="2"><label for="q1-2">No</label>
    </fieldset>
    <label for="q2">Which days are you available to work?</label>
    <select id="q2" name="q2"><option value="-1">Select...</option><option value="a">Weekdays</option><option value="b">Weekends</option><option value="c">Any day</option></select>
    <label for="q3">Tell us why you want to work with us.</label>
    <textarea id="q3" name="q3" maxlength="1000"></textarea>
    <div class="buttons">
      <input type="button" value="Previous">
      <input type="button" value="Save and Continue">
    </div>
  </form>
</body>
</html>
