<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application - Sample Labs</title>
  <meta property="og:site_name" content="Sample Labs">
</head>
<body>
  <div id="et-ef-content-ftf-flowTrail" class="flowTrail">
    <span class="ftlcompleted">Personal Information</span>
    <span class="ftlcurrent">Attachments</span>
    <span class="ftlnotvisited">Review and Submit</span>
  </div>
  <form id="editTemplateMultipart" method="post" enctype="multipart/form-data">
    <div id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-AttachedFilesBlock">
      <h2>Attach a resume</h2>
      <input type="file" id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-AttachedFilesBlock-resumeFileInput" name="resumeFile">
      <input type="button" id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-AttachedFilesBlock-attachCmd" value="Attach">
    </div>
    <fieldset>
      <legend>Other attachments</legend>
      <label for="att-desc">Description of the file</label>
      <input type="text" id="att-desc" name="att-desc">
      <input type="file" id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-otherAttachment" name="otherAttachment">
    </fieldset>
    <div class="buttons">
      <input type="button" value="Previous">
      <input type="button" value="Save and Continue">
    </div>
  </form>
</body>
</html>
