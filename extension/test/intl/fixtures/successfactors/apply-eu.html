<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Bewerbung - Sample Labs</title>
  <meta property="og:site_name" content="Sample Labs Careers">
</head>
<body>
  <h1 class="jobTitle">Laborant (m/w/d)</h1>
  <div class="applicationForm">
    <form method="post" action="/careers?career_ns=job_application&amp;company=SampleLabsP">
      <fieldset data-signin><legend>Sign in</legend>
        <label for="fbclc_username">Username</label><input type="text" id="fbclc_username" name="fbclc_username">
        <label for="fbclc_password">Password</label><input type="password" id="fbclc_password" name="fbclc_password">
      </fieldset>
      <div class="field"><label for="fbclc_firstName">First Name *</label><input type="text" id="fbclc_firstName" name="fbclc_firstName" required></div>
      <div class="field"><label for="fbclc_lastName">Last Name *</label><input type="text" id="fbclc_lastName" name="fbclc_lastName" required></div>
      <div class="field"><label for="fbclc_contactEmail">Contact E-mail *</label><input type="email" id="fbclc_contactEmail" name="fbclc_contactEmail" required></div>
      <div class="field"><label for="fbclc_address">Address</label><input type="text" id="fbclc_address" name="fbclc_address"></div>
      <div class="field"><label for="fbclc_linkedIn">LinkedIn</label><input type="url" id="fbclc_linkedIn" name="fbclc_linkedIn"></div>
      <div class="fileUploadField"><label>CV / Resume</label><input type="file" id="fbclc_resume" name="fbclc_resume"></div>
      <div class="fileUploadField"><label>Cover Letter</label><input type="file" id="fbclc_coverLetterUpload" name="fbclc_coverLetterUpload"></div>
      <input type="submit" value="Apply">
    </form>
  </div>
</body>
</html>
