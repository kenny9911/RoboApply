<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Data Analyst</title>
  <meta property="og:site_name" content="Sample Labs Careers">
</head>
<body>
  <aside>
    <h2 data-automation-id="jobPostingHeader">Data Analyst</h2>
    <div data-automation-id="locations"><dl><dt>locations</dt><dd>Remote - US</dd></dl></div>
  </aside>
  <main data-automation-id="applyFlowContainer">
    <div data-automation-id="progressBar">
      <ol>
        <li data-automation-id="progressBarActiveStep">My Information</li>
        <li data-automation-id="progressBarInactiveStep">Review</li>
      </ol>
    </div>
    <div data-automation-id="contactInformationPage">
      <div data-automation-id="formField-legalName--firstName">
        <label for="name--legalName--firstName">Given Name(s)<span>*</span></label>
        <input type="text" id="name--legalName--firstName" name="legalName--firstName" required>
      </div>
      <div data-automation-id="formField-legalName--lastName">
        <label for="name--legalName--lastName">Family Name<span>*</span></label>
        <input type="text" id="name--legalName--lastName" name="legalName--lastName" required>
      </div>
      <div data-automation-id="formField-preferredName--firstName">
        <label for="name--preferredName--firstName">Preferred Given Name</label>
        <input type="text" id="name--preferredName--firstName" name="preferredName--firstName">
      </div>
      <div data-automation-id="formField-preferredName--lastName">
        <label for="name--preferredName--lastName">Preferred Family Name</label>
        <input type="text" id="name--preferredName--lastName" name="preferredName--lastName">
      </div>
      <div data-automation-id="formField-addressLine1">
        <label for="address--addressLine1">Address Line 1</label>
        <input type="text" id="address--addressLine1" name="addressLine1">
      </div>
      <div data-automation-id="formField-city">
        <label for="address--city">City</label>
        <input type="text" id="address--city" name="city">
      </div>
      <div data-automation-id="formField-postalCode">
        <label for="address--postalCode">ZIP Code</label>
        <input type="text" id="address--postalCode" name="postalCode">
      </div>
      <div data-automation-id="formField-email">
        <label for="email">Email Address</label>
        <input type="text" id="email" name="email">
      </div>
      <div data-automation-id="formField-phoneNumber">
        <label for="phoneNumber--phoneNumber">Phone Number<span>*</span></label>
        <input type="text" id="phoneNumber--phoneNumber" name="phoneNumber" required>
      </div>
    </div>
    <div data-automation-id="pageFooter">
      <button type="button" data-automation-id="pageFooterBackButton">Back</button>
      <button type="button" data-automation-id="pageFooterNextButton">Save and Continue</button>
    </div>
  </main>
</body>
</html>
