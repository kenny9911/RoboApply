<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workday</title>
  <meta property="og:site_name" content="Example Co Careers">
</head>
<body>
  <div data-automation-id="utilityMenu"><input type="text" aria-label="Search for jobs" data-automation-id="keywordSearchInput"><button type="button">Sign Out</button></div>
  <div data-automation-id="applyFlowPage">
    <div data-automation-id="progressBar">
      <ol>
        <li data-automation-id="progressBarCompletedStep">Create Account/Sign In</li>
        <li data-automation-id="progressBarActiveStep">My Information</li>
        <li data-automation-id="progressBarInactiveStep">My Experience</li>
        <li data-automation-id="progressBarInactiveStep">Application Questions</li>
        <li data-automation-id="progressBarInactiveStep">Voluntary Disclosures</li>
        <li data-automation-id="progressBarInactiveStep">Review</li>
      </ol>
    </div>
    <div data-automation-id="contactInformationPage">
      <h2>My Information</h2>
      <div data-automation-id="formField-sourceDropdown">
        <label for="input-1">How Did You Hear About Us?<abbr title="required">*</abbr></label>
        <div data-automation-id="multiselectInputContainer"><input type="text" id="input-1" data-automation-id="searchBox" placeholder="Search"></div>
      </div>
      <fieldset data-automation-id="formField-candidateIsPreviousWorker">
        <legend><label>Have you previously worked for Example Co?<abbr title="required">*</abbr></label></legend>
        <div><input type="radio" id="input-2-yes" name="candidateIsPreviousWorker" value="true"><label for="input-2-yes">Yes</label></div>
        <div><input type="radio" id="input-2-no" name="candidateIsPreviousWorker" value="false"><label for="input-2-no">No</label></div>
      </fieldset>
      <div data-automation-id="formField-countryDropdown">
        <label for="input-3">Country<abbr title="required">*</abbr></label>
        <button type="button" id="input-3" aria-haspopup="listbox" data-automation-id="countryDropdown">United States of America</button>
      </div>
      <div data-automation-id="formField-legalNameSection_firstName">
        <label for="input-4">First Name<abbr title="required">*</abbr></label>
        <input type="text" id="input-4" data-automation-id="legalNameSection_firstName" aria-required="true">
      </div>
      <div data-automation-id="formField-legalNameSection_lastName">
        <label for="input-5">Last Name<abbr title="required">*</abbr></label>
        <input type="text" id="input-5" data-automation-id="legalNameSection_lastName" aria-required="true">
      </div>
      <div data-automation-id="formField-preferredNameCheckbox">
        <input type="checkbox" id="input-6" data-automation-id="preferredNameCheckbox"><label for="input-6">I have a preferred name</label>
      </div>
      <div data-automation-id="formField-addressSection_addressLine1">
        <label for="input-7">Address Line 1</label>
        <input type="text" id="input-7" data-automation-id="addressSection_addressLine1">
      </div>
      <div data-automation-id="formField-addressSection_city">
        <label for="input-8">City</label>
        <input type="text" id="input-8" data-automation-id="addressSection_city">
      </div>
      <div data-automation-id="formField-addressSection_countryRegion">
        <label for="input-9">State</label>
        <button type="button" id="input-9" aria-haspopup="listbox" data-automation-id="addressSection_countryRegion">Select One</button>
      </div>
      <div data-automation-id="formField-addressSection_postalCode">
        <label for="input-10">Postal Code</label>
        <input type="text" id="input-10" data-automation-id="addressSection_postalCode">
      </div>
      <div data-automation-id="formField-email">
        <label for="input-11">Email</label>
        <input type="text" id="input-11" data-automation-id="email">
      </div>
      <div data-automation-id="formField-phone-device-type">
        <label for="input-12">Phone Device Type<abbr title="required">*</abbr></label>
        <button type="button" id="input-12" aria-haspopup="listbox" data-automation-id="phone-device-type">Mobile</button>
      </div>
      <div data-automation-id="formField-countryPhoneCode">
        <label for="input-13">Country Phone Code<abbr title="required">*</abbr></label>
        <div data-automation-id="multiselectInputContainer"><input type="text" id="input-13" data-automation-id="searchBox" placeholder="Search"></div>
      </div>
      <div data-automation-id="formField-phone-number">
        <label for="input-14">Phone Number<abbr title="required">*</abbr></label>
        <input type="text" id="input-14" data-automation-id="phone-number" aria-required="true">
      </div>
      <div data-automation-id="formField-phone-extension">
        <label for="input-15">Phone Extension</label>
        <input type="text" id="input-15" data-automation-id="phone-extension">
      </div>
    </div>
    <div data-automation-id="pageFooter">
      <button type="button" data-automation-id="backButton">Back</button>
      <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
    </div>
  </div>
</body>
</html>
