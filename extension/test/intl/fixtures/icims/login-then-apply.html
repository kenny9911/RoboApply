<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apply | Demo Studio Careers</title>
  <meta property="og:site_name" content="Demo Studio Careers">
</head>
<body>
  <div class="iCIMS_MainWrapper">
    <div class="iCIMS_Header"><h1>Junior Designer</h1></div>
    <form id="iCIMS_ApplyForm" method="post">
      <div id="loginForm" data-signin>
        <div class="iCIMS_FieldRow"><label for="login_email">Email Address</label><input type="email" id="login_email" name="login_email"></div>
        <div class="iCIMS_FieldRow"><label for="login_password">Password</label><input type="password" id="login_password" name="login_password"></div>
      </div>
      <h2>Your information</h2>
      <div class="iCIMS_FieldRow"><label for="PersonProfileFields.FirstName">First Name *</label><input type="text" id="PersonProfileFields.FirstName" name="PersonProfileFields.FirstName" required></div>
      <div class="iCIMS_FieldRow"><label for="PersonProfileFields.LastName">Last Name *</label><input type="text" id="PersonProfileFields.LastName" name="PersonProfileFields.LastName" required></div>
      <div class="iCIMS_FieldRow"><label for="PersonProfileFields.Email">Email *</label><input type="email" id="PersonProfileFields.Email" name="PersonProfileFields.Email" required></div>
      <div class="iCIMS_FieldRow"><label for="PersonProfileFields.MobilePhone">Mobile Phone</label><input type="tel" id="PersonProfileFields.MobilePhone" name="PersonProfileFields.MobilePhone"></div>
      <div class="iCIMS_FieldRow"><span class="iCIMS_InfoField">Resume *</span><input type="file" id="resume" name="resume" required></div>
      <div class="iCIMS_FieldRow"><input type="checkbox" id="rcf_terms" name="rcf_terms"><label for="rcf_terms">I agree to be contacted about this role</label></div>
      <input type="submit" value="Submit">
    </form>
  </div>
</body>
</html>
