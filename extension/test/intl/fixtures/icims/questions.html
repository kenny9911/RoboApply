<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Questions | Sample Labs Careers</title>
  <meta property="og:site_name" content="Sample Labs Careers">
</head>
<body>
  <div id="iCIMS_MainWrapper">
    <h1 class="iCIMS_Header">Lab Technician II</h1>
    <form class="iCIMS_Forms" method="post">
      <table class="iCIMS_Table">
        <tr class="iCIMS_TableRow">
          <td class="iCIMS_TableLabel">Are you at least 18 years of age? *</td>
          <td>
            <label><input type="radio" name="rcf3048" value="Yes" required> Yes</label>
            <label><input type="radio" name="rcf3048" value="No"> No</label>
          </td>
        </tr>
        <tr class="iCIMS_TableRow">
          <td class="iCIMS_TableLabel"><label for="rcf3050">Which shift do you prefer?</label></td>
          <td><select id="rcf3050" name="rcf3050"><option value="">— Make a Selection —</option><option>Day</option><option>Night</option></select></td>
        </tr>
        <tr class="iCIMS_TableRow">
          <td class="iCIMS_TableLabel"><label for="rcf3052">Tell us about your lab experience.</label></td>
          <td><textarea id="rcf3052" name="rcf3052"></textarea></td>
        </tr>
        <tr class="iCIMS_TableRow">
          <td class="iCIMS_TableLabel"><label for="PersonProfileFields.LinkedIn">LinkedIn Profile URL</label></td>
          <td><input type="text" id="PersonProfileFields.LinkedIn" name="PersonProfileFields.LinkedIn"></td>
        </tr>
        <tr class="iCIMS_TableRow">
          <td class="iCIMS_TableLabel">Cover Letter</td>
          <td><input type="file" id="cover_letter_file" name="cover_letter_file"></td>
        </tr>
      </table>
      <input type="hidden" name="hashed" value="0">
      <input type="text" name="honeypot_field" aria-hidden="true" tabindex="-1">
      <button type="button" class="iCIMS_SecondaryButton">Previous</button>
      <button type="submit" class="iCIMS_PrimaryButton">Next</button>
    </form>
  </div>
</body>
</html>
