<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Barista</title>
  <meta property="og:site_name" content="Demo Studio">
</head>
<body>
  <h1 data-ui="job-title">Barista</h1>
  <div data-ui="application-form">
    <form>
      <div data-ui="field"><label for="firstname">First name</label><input id="firstname" name="firstname" type="text"></div>
      <div data-ui="field"><label for="lastname">Last name</label><input id="lastname" name="lastname" type="text"></div>
      <div data-ui="field"><label for="email">Email</label><input id="email" name="email" type="email"></div>
      <div data-ui="resume"><label>CV</label><input type="file" name="resume"></div>
      <button type="submit">Submit application</button>
    </form>
  </div>
</body>
</html>
