<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Office Coordinator - Sample Labs</title>
  <meta property="og:site_name" content="Sample Labs">
</head>
<body>
  <h2 class="job-title">Office Coordinator</h2>
  <div class="job-location">Portland, Oregon</div>
  <div class="job-description"><p>Keep our office running smoothly.</p><ul><li>Order supplies</li><li>Greet visitors</li></ul></div>
  <form id="applicationForm" role="form">
    <div class="form-group"><label for="firstName">First Name*</label><input id="firstName" name="firstName" type="text" required></div>
    <div class="form-group"><label for="lastName">Last Name*</label><input id="lastName" name="lastName" type="text" required></div>
    <div class="form-group"><label for="email">Email*</label><input id="email" name="email" type="text" required></div>
    <div class="form-group"><label for="phone">Phone*</label><input id="phone" name="phone" type="text" required></div>
    <div class="form-group"><label for="streetAddress">Address</label><input id="streetAddress" name="streetAddress" type="text"></div>
    <div class="form-group"><label for="city">City</label><input id="city" name="city" type="text"></div>
    <div class="form-group"><label for="zip">ZIP</label><input id="zip" name="zip" type="text"></div>
    <div class="form-group"><label>Resume*</label><input id="resumeFileId" name="resumeFileId" type="file" required></div>
    <div class="form-group"><label for="dateAvailable">Date Available</label><input id="dateAvailable" name="dateAvailable" type="date"></div>
    <div class="form-group"><label for="desiredPay">Desired Pay</label><input id="desiredPay" name="desiredPay" type="text"></div>
    <div class="form-group"><input type="checkbox" id="text-ok" name="text-ok"><label for="text-ok">It's okay to send me text messages</label></div>
    <button type="submit" class="fab-Button">Submit Application</button>
  </form>
</body>
</html>
