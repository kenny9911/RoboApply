<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apply: Sales Engineer | Example Co</title>
  <meta property="og:site_name" content="Example Co Careers">
</head>
<body>
  <h2 class="jv-header">Sales Engineer</h2>
  <p class="jv-job-detail-meta">Chicago, Illinois</p>
  <form class="jv-form" method="post" action="/exampleco/job/oAbC123/apply">
    <div class="jv-form-field"><label for="jv-field-first">First Name <span class="jv-required">*</span></label><input id="jv-field-first" name="firstName" type="text" required></div>
    <div class="jv-form-field"><label for="jv-field-last">Last Name <span class="jv-required">*</span></label><input id="jv-field-last" name="lastName" type="text" required></div>
    <div class="jv-form-field"><label for="jv-field-email">Email <span class="jv-required">*</span></label><input id="jv-field-email" name="email" type="email" required></div>
    <div class="jv-form-field"><label for="jv-field-phone">Phone</label><input id="jv-field-phone" name="phone" type="tel"></div>
    <div class="jv-form-field"><label for="jv-field-linkedin">LinkedIn Profile</label><input id="jv-field-linkedin" name="linkedInUrl" type="url"></div>
    <div class="jv-form-field">
      <label for="jv-field-source">How did you hear about us?</label>
      <select id="jv-field-source" name="source"><option value="">Select</option><option>Company website</option><option>Referral</option></select>
    </div>
    <fieldset class="jv-form-field"><legend>Resume <span class="jv-required">*</span></legend><input id="jv-field-resume" name="resume" type="file" required><button type="button" class="jv-button">Upload</button></fieldset>
    <div class="jv-form-field"><label for="jv-field-why">Why do you want to join?</label><textarea id="jv-field-why" name="why"></textarea></div>
    <div class="jv-form-actions"><button type="submit" class="jv-button jv-button-primary">Send Application</button></div>
  </form>
</body>
</html>
