<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Field Technician - Sample Labs</title>
</head>
<body>
  <div itemscope itemtype="https://schema.org/JobPosting">
    <h1 itemprop="title">Field Technician</h1>
    <div itemprop="hiringOrganization" itemscope><span itemprop="name">Sample Labs</span></div>
    <span itemprop="jobLocation">Leeds, United Kingdom</span>
    <div itemprop="description"><p>Install and service lab equipment across the region.</p></div>
  </div>
  <form name="applicationForm" novalidate>
    <div class="field"><label for="first-name-input">First name *</label><input id="first-name-input" name="firstName" type="text" required></div>
    <div class="field"><label for="last-name-input">Last name *</label><input id="last-name-input" name="lastName" type="text" required></div>
    <div class="field"><label for="email-input">Email *</label><input id="email-input" name="email" type="email" required></div>
    <div class="field"><label for="phone-number-input">Phone number</label><input id="phone-number-input" name="phoneNumber" type="tel"></div>
    <div class="field"><label for="city-input">City</label><input id="city-input" name="city" type="text"></div>
    <div class="field">
      <label for="source">How did you hear about us?</label>
      <select id="source" name="source">
        <option value="">Select</option>
        <option value="web">Company website</option>
        <option value="ref">Referral</option>
        <option value="other">Other</option>
      </select>
    </div>
    <fieldset>
      <legend>Do you hold a full UK driving licence? *</legend>
      <label><input type="radio" name="q_licence" value="yes" required> Yes</label>
      <label><input type="radio" name="q_licence" value="no"> No</label>
    </fieldset>
    <div class="field"><label for="resume-upload-input">Resume *</label><input id="resume-upload-input" name="resume" type="file" required></div>
    <div class="actions"><button type="submit">Submit application</button></div>
  </form>
</body>
</html>
