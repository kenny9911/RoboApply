<!doctype html>
<html>
<head><title>Account Executive @ Sample Labs</title></head>
<body>
<h1 class="ashby-job-posting-heading">Account Executive</h1>
<form class="ashby-application-form-container">
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_name">Name*</label>
    <input id="_systemfield_name" name="_systemfield_name" type="text" required>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_email">Email*</label>
    <input id="_systemfield_email" name="_systemfield_email" type="email" required>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_resume">Resume*</label>
    <input id="_systemfield_resume" name="_systemfield_resume" type="file" required>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="ab12-company">Current Company</label>
    <input id="ab12-company" name="ab12-company" type="text">
  </div>
  <fieldset class="ashby-application-form-field-entry">
    <legend class="ashby-application-form-question-title">Gender</legend>
    <label><input type="radio" name="eeo-gender" value="Male"> Male</label>
    <label><input type="radio" name="eeo-gender" value="Female"> Female</label>
    <label><input type="radio" name="eeo-gender" value="Decline to self-identify"> Decline to self-identify</label>
  </fieldset>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="eeo-veteran">Veteran Status</label>
    <select id="eeo-veteran" name="eeo-veteran"><option value="">Select…</option><option>I am a protected veteran</option><option>I am not a protected veteran</option><option>Decline to self-identify</option></select>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="ab12-quota">What was your quota attainment last year?</label>
    <input id="ab12-quota" name="ab12-quota" type="text">
  </div>
  <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
</form>
</body>
</html>
