<!doctype html>
<html>
<head><title>Office Coordinator @ Demo Studio</title></head>
<body>
<h1 class="ashby-job-posting-heading">Office Coordinator</h1>
<form class="ashby-application-form-container">
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_name">Name*</label>
    <input id="_systemfield_name" name="_systemfield_name" type="text" required>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_email">Email*</label>
    <input id="_systemfield_email" name="_systemfield_email" type="email" required>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_resume">Resume</label>
    <input id="_systemfield_resume" name="_systemfield_resume" type="file">
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="pp-1">Pronouns</label>
    <input id="pp-1" name="pp-1" type="text">
  </div>
  <div class="ashby-application-form-field-entry">
    <label><input type="checkbox" id="ok-contact" name="ok-contact"> You may contact me about other openings</label>
  </div>
  <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
</form>
</body>
</html>
