<!doctype html>
<html>
<head><title>Site Reliability Engineer @ Example Co</title><meta property="og:title" content="Site Reliability Engineer @ Example Co"></head>
<body>
<div class="ashby-job-posting-left-pane"><h1 class="ashby-job-posting-heading">Site Reliability Engineer</h1><div class="_job-posting-location">Remote (US)</div></div>
<div class="ashby-job-posting-description"><p>Keep our services up and fast.</p></div>
<form class="ashby-application-form-container">
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_name">Name<span class="_required">*</span></label>
    <input id="_systemfield_name" name="_systemfield_name" type="text" required>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_email">Email<span class="_required">*</span></label>
    <input id="_systemfield_email" name="_systemfield_email" type="email" required>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_resume">Resume<span class="_required">*</span></label>
    <input id="_systemfield_resume" name="_systemfield_resume" type="file" required>
    <button type="button" class="_uploadButton">Upload File</button>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="3f6a1c1e-phone">Phone Number</label>
    <input id="3f6a1c1e-phone" name="3f6a1c1e-phone" type="tel">
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="9b2d-linkedin">LinkedIn Profile</label>
    <input id="9b2d-linkedin" name="9b2d-linkedin" type="url">
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="_systemfield_location">Location</label>
    <input id="_systemfield_location" role="combobox" aria-controls="loc-listbox" aria-expanded="false" type="text" value="">
    <div id="loc-listbox" role="listbox" hidden><div role="option">Austin, Texas, United States</div><div role="option">Boston, Massachusetts, United States</div></div>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title">Are you open to being on call one week a month?<span class="_required">*</span></label>
    <div class="_yesno"><button type="button" class="_option">Yes</button><button type="button" class="_option">No</button></div>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title" for="c7e1-why">What draws you to this role?<span class="_required">*</span></label>
    <textarea id="c7e1-why" name="c7e1-why" required></textarea>
  </div>
  <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
</form>
</body>
</html>
