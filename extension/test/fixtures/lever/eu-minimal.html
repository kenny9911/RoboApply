<!doctype html>
<html>
<head><title>Demo Studio - Junior Developer</title><meta property="og:title" content="Demo Studio - Junior Developer"></head>
<body>
<div class="posting-headline"><h2>Junior Developer</h2><div class="posting-categories"><div class="location">Berlin</div></div></div>
<div class="section-wrapper page-full-width"><p>Learn to ship web features with a small team.</p></div>
<form class="application-form" method="POST">
  <ul>
    <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required></div></label></li>
    <li class="application-question resume"><label><div class="application-label">Resume/CV</div><div class="application-field"><input type="file" name="resume"></div></label></li>
    <li class="application-question"><label><div class="application-label">Twitter URL</div><div class="application-field"><input type="text" name="urls[Twitter]"></div></label></li>
    <li class="application-question consent">
      <label><input type="checkbox" name="consent[store]" value="true"> Keep my details on file for future roles</label>
    </li>
  </ul>
  <div id="h-captcha" class="h-captcha"><input type="hidden" name="h-captcha-response"></div>
  <button type="submit" class="template-btn-submit">Submit application</button>
</form>
</body>
</html>
