<!doctype html>
<html>
<head><title>Example Co - Backend Engineer</title><meta property="og:title" content="Example Co - Backend Engineer"></head>
<body>
<div class="main-header page-full-width"><div class="main-header-content"><a class="main-header-logo" href="#"><img alt="Example Co logo" src="data:,"></a></div></div>
<div class="content-wrapper posting-page">
  <div class="posting-headline">
    <h2>Backend Engineer</h2>
    <div class="posting-categories"><div class="posting-category location">Austin, Texas</div><div class="posting-category commitment">Full-time</div></div>
  </div>
  <div class="section-wrapper page-full-width"><p>Build the APIs our mobile apps use.</p></div>
  <form class="application-form" id="application-form" method="POST" enctype="multipart/form-data" action="/exampleco/abc-123/apply">
    <div class="section application-form page-centered">
      <h4>Submit your application</h4>
      <ul>
        <li class="application-question resume">
          <label>
            <div class="application-label">Resume/CV<span class="required">✱</span></div>
            <div class="application-field"><input type="file" name="resume" id="resume-upload-input" class="application-file-input"></div>
          </label>
        </li>
        <li class="application-question">
          <label><div class="application-label">Full name<span class="required">✱</span></div>
          <div class="application-field"><input type="text" name="name" required></div></label>
        </li>
        <li class="application-question">
          <label><div class="application-label">Email<span class="required">✱</span></div>
          <div class="application-field"><input type="email" name="email" required></div></label>
        </li>
        <li class="application-question">
          <label><div class="application-label">Phone</div>
          <div class="application-field"><input type="text" name="phone"></div></label>
        </li>
        <li class="application-question">
          <label><div class="application-label">Current company</div>
          <div class="application-field"><input type="text" name="org"></div></label>
        </li>
      </ul>
    </div>
    <div class="section application-form page-centered">
      <h4>Links</h4>
      <ul>
        <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
        <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
        <li class="application-question"><label><div class="application-label">Portfolio URL</div><div class="application-field"><input type="text" name="urls[Portfolio]"></div></label></li>
      </ul>
    </div>
    <div class="section application-form page-centered">
      <ul>
        <li class="application-question custom-question">
          <div class="application-label"><div class="text">Are you authorized to work in the United States?<span class="required">✱</span></div></div>
          <div class="application-field">
            <ul data-qa="multiple-choice">
              <li><label><input type="radio" name="cards[c1][field0]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li>
              <li><label><input type="radio" name="cards[c1][field0]" value="No"><span class="application-answer-alternative">No</span></label></li>
            </ul>
          </div>
        </li>
        <li class="application-question custom-question">
          <div class="application-label"><div class="text">Anything else you want us to know?</div></div>
          <div class="application-field"><textarea name="cards[c1][field1]" class="card-field-input"></textarea></div>
        </li>
      </ul>
    </div>
    <div class="section application-form page-centered">
      <h4>U.S. Equal Employment Opportunity information</h4>
      <ul>
        <li class="application-question"><label><div class="application-label">Gender</div><div class="application-field"><select name="eeo[gender]"><option value="">Select ...</option><option value="Female">Female</option><option value="Male">Male</option><option value="Decline to self-identify">Decline to self-identify</option></select></div></label></li>
        <li class="application-question"><label><div class="application-label">Veteran status</div><div class="application-field"><select name="eeo[veteran]"><option value="">Select ...</option><option value="I am a veteran">I am a veteran</option><option value="I am not a veteran">I am not a veteran</option><option value="Decline to self-identify">Decline to self-identify</option></select></div></label></li>
      </ul>
    </div>
    <div class="section page-centered last-section-apply">
      <button type="submit" class="template-btn-submit postings-btn" data-qa="btn-submit">Submit application</button>
    </div>
  </form>
</div>
</body>
</html>
