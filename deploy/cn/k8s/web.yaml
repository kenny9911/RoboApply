# The Next.js standalone server (deploy/cn/Dockerfile.web).
#
# Secrets/config from `goapply-web-env`, names in deploy/cn/cn.web.env.example:
# INTERNAL_API_SECRET, CN_CANONICAL_ORIGIN, BAIDU_SITE_VERIFICATION, BRAND_HOST_MAP
# and the legal-page values /legal/[doc] reads (CN_LEGAL_ENTITY_NAME,
# CN_LEGAL_POSTAL_ADDRESS, CN_SUPPORT_EMAIL, CN_COMPLAINT_EMAIL,
# CN_COMPLAINT_PHONE, CN_LEGAL_DOCS_VERSION); docs/runbooks/cn-deploy.md §4.
# NEXT_PUBLIC_API_URL is a RUNTIME value here: server-side SEO reads
# (lib/server/publicApi.ts) reach the API Service directly. The browser bundle
# was built without it and calls /api/v1/* same-origin through the gateway.
#
# Caching note: each replica has its own Next.js cache, and /api/revalidate
# (called by the seo-rebuild cron through the public origin) reaches one replica.
# Other replicas refresh within the page TTL (15 min). See the runbook §9.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: goapply-web
    app.kubernetes.io/part-of: goapply
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: goapply-web
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goapply-web
        app.kubernetes.io/part-of: goapply
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-pull
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: web
          image: goapply-web
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - secretRef: { name: goapply-web-env }
          env:
            - { name: NODE_ENV, value: "production" }
            - { name: PORT, value: "3000" }
            # Kubernetes sets HOSTNAME to the pod name; the standalone server binds to it.
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: DEPLOY_REGION, value: "cn-mainland" }
            - { name: ALLOWED_BRANDS, value: "goapply" }
            - { name: NEXT_PUBLIC_API_URL, value: "http://api:4607" }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["node", "-e", "setTimeout(() => {}, 10000)"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: goapply-web
    app.kubernetes.io/part-of: goapply
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: goapply-web
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goapply-web
