# deploy/cn/nginx.conf — routing gateway for the GoApply mainland stack (WP-76).
#
# Mirrors vercel.json: its only rewrite is `/api/v1/:path*` → the API
# function, and everything else is the Next.js app (which also serves its own
# /api/health and /api/revalidate route handlers). __tests__/deploy/deployKit.test.ts
# fails if the API locations here stop matching vercel.json `rewrites`.
#
# Upstream names are the Kubernetes Service names (deploy/cn/k8s) and the
# compose service names (deploy/cn/compose.yaml): `web` and `api`.
#
# Differences from Vercel, on purpose:
#   - /api/v1/cron/* answers 404 from outside. The CronJobs call the API Service
#     directly inside the cluster, so the sweeps are never reachable from the
#     internet (Vercel exposes them, guarded only by CRON_SECRET).
#   - Any letter case of /api/v1/cron is refused too: Express matches its mount
#     paths case-insensitively, so `/api/v1/CRON/...` would otherwise reach the
#     cron router (server-level check below, on the normalised $uri).
#   - The client-supplied `X-RA-Brand` and `x-ra-client-ip` headers are dropped.
#     The brand comes from the Host header.
#   - The visitor address is resolved HERE and the forwarding headers are
#     rewritten, never appended to. Vercel's edge overwrites X-Forwarded-For; an
#     nginx that appended ($proxy_add_x_forwarded_for) would let a client put any
#     address first, and the API (`trust proxy`, req.ip = leftmost entry) would
#     key its per-IP rate limits (login, SMS OTP, signup) on that forged value.
#
# TLS terminates at the Aliyun SLB in front of the gateway Service. Its HTTP/HTTPS
# (layer-7) listeners connect from the SLB's own backend range and add the
# visitor's address as the last X-Forwarded-For entry; they also forward
# X-Forwarded-Proto, which is passed on (or set to this hop's scheme).

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  # Unprivileged image: every writable path lives under /tmp.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  log_format gateway '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                     '$request_time $upstream_response_time "$host" "$http_user_agent"';
  access_log /dev/stdout gateway;
  error_log /dev/stderr warn;

  # Express accepts JSON / form bodies up to 10 MB; resume uploads ride on top.
  client_max_body_size 25m;

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Visitor address (ngx_http_realip_module). Only the SLB hop is trusted:
  # 100.64.0.0/10 is the source range of Aliyun SLB (CLB/ALB) backend
  # connections. With real_ip_recursive, nginx takes the right-most address in
  # X-Forwarded-For that is NOT a trusted hop, i.e. the one the SLB appended;
  # whatever the client put in front of it is ignored. A connection from
  # anywhere else (compose, a port-forward) keeps its own peer address and its
  # X-Forwarded-For is discarded. If your SLB type connects from another range,
  # add that range here (docs/runbooks/cn-deploy.md §3) — never 0.0.0.0/0.
  set_real_ip_from 100.64.0.0/10;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  map $http_x_forwarded_proto $ra_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  upstream ra_web {
    server web:3000;
    keepalive 32;
  }

  upstream ra_api {
    server api:4607;
    keepalive 32;
  }

  server {
    listen 8080;
    # IPv6 listener, only where the kernel has IPv6: written at container start
    # by deploy/cn/gateway-listen-ipv6.sh (a node booted with ipv6.disable=1
    # would otherwise refuse `listen [::]` and crash-loop the gateway). An empty
    # directory is fine for a wildcard include.
    include /tmp/nginx-listen.d/*.conf;
    server_name _;

    # Cron sweeps are cluster-internal (deploy/cn/k8s/cronjobs.yaml). Checked on
    # the normalised, decoded $uri and case-insensitively, before any location:
    # Express routes /api/v1/CRON/... to the cron router as well.
    if ($uri ~* "^/api/v1/cron(/|$)") {
      return 404;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $ra_forwarded_proto;
    # Overwrite, never append: $remote_addr is the visitor resolved above.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-RA-Brand "";
    proxy_set_header x-ra-client-ip "";

    # Gateway liveness for the SLB and the kubelet.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Same rule as the server-level check above, kept as an explicit location.
    location ^~ /api/v1/cron/ {
      return 404;
    }

    # vercel.json rewrite: /api/v1/:path* -> api (maxDuration 300 s).
    # Unbuffered so SSE / NDJSON streams (Assistant, imports) reach the browser as they are written.
    location ^~ /api/v1/ {
      proxy_pass http://ra_api;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Everything else: the Next.js standalone server. Unbuffered for streamed
    # RSC / Suspense responses (Next.js self-hosting guide).
    location / {
      proxy_pass http://ra_web;
      proxy_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
